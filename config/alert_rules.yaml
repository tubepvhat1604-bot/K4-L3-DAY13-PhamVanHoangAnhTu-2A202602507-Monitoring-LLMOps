alerts:
  - name: HighLatencyP95
    severity: P2-warning
    condition: 'p95(response_sent.latency_ms) > 2000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602507
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: P1-critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2  OR  retrieval_success_rate_pct < 90'
    duration: 3m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602507
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-2
  - name: CostPerRequestSpike
    severity: P2-warning
    condition: 'mean(response_sent.cost_usd) > 0.006  OR  sum(response_sent.cost_usd) over 60m > 2.5'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602507
    slo: guardrails.daily_cost_usd_max
    runbook: docs/alerts.md#alert-3
